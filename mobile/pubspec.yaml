name: nisk_app
description: "NISK App - Multi-Service Marketplace Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  provider: ^6.0.5
  go_router: ^10.0.0
  # UI
  google_fonts: ^8.2.1
  cupertino_icons: ^1.0.2
  device_preview: ^1.1.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.1
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/locales/
    - assets/images/
    - .env
