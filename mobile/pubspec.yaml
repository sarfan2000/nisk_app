name: nisk_app
description: "NISK App - Multi-Service Marketplace Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  provider: ^6.0.5
  go_router: ^10.0.0
  # UI
  google_fonts: ^8.2.1
  cupertino_icons: ^1.0.2
  device_preview: ^1.1.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.1
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1
  easy_localization: ^3.0.8
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/locales/
    - assets/images/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Nisk.jpeg"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/Nisk.jpeg"
  android_12:
    image: "assets/images/Nisk.jpeg"
    color: "#FFFFFF"

